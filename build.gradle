plugins {
	id 'eclipse'
	id 'java'
	id 'maven-publish'
}

repositories {
	// Use Maven Central for resolving dependencies.
	mavenCentral()
}

dependencies {
	// Use JUnit test framework.
	testImplementation 'junit:junit:4.13.2'
	implementation group: 'org.bytedeco', name: 'javacpp', version: '1.5.7'
	// https://mvnrepository.com/artifact/javax.xml.bind/jaxb-api
	implementation group: 'javax.xml.bind', name: 'jaxb-api', version: '2.3.1'
	implementation 'net.codesup.util:jaxb2-rich-contract-plugin:2.1.0'

	//Java17 update
	// JAXB API
	implementation 'javax.xml.bind:jaxb-api:2.3.1'

	// JAXB Implementation
	implementation 'com.sun.xml.bind:jaxb-impl:2.3.1'

	// JAXB Core
	implementation 'com.sun.xml.bind:jaxb-core:2.3.0.1'

	// Java Activation needed by JAXB
	implementation 'javax.activation:javax.activation-api:1.2.0'
}


//if(JavaVersion.current() != JavaVersion.VERSION_1_8){
//	throw new GradleException("This build must be run with java 8")
//}


// Clojars coordinates. The version comes from the git tag; see findVersion.sh.
group = 'com.neuronrobotics'
base { archivesName = 'mujoco-java' }
version = System.getenv("VERSION_SEMVER") ?: '0.0.0-SNAPSHOT'

publishing {
	repositories {
		// only configured when publishing (-PmavenRepo=clojars), so ordinary
		// builds never require credentials
		if (project.hasProperty('mavenRepo') && project.property('mavenRepo') == 'clojars') {
			maven {
				name = 'clojars'
				url = 'https://clojars.org/repo'
				credentials {
					username = System.getenv('CLOJARS_USERNAME')
					password = System.getenv('CLOJARS_TOKEN')
				}
			}
		}
	}
	publications {
		mavenJava(MavenPublication) {
			from components.java
			pom {
				name = 'mujoco-java'
				packaging = 'jar'
				description = 'Java bindings for the MuJoCo physics engine'
				url = 'https://github.com/CommonWealthRobotics/mujoco-java'

				scm {
					connection = 'scm:git:https://github.com/CommonWealthRobotics/mujoco-java.git'
					developerConnection = 'scm:git:git@github.com:CommonWealthRobotics/mujoco-java.git'
					url = 'https://github.com/CommonWealthRobotics/mujoco-java'
				}

				licenses {
					license {
						name = 'The Apache License, Version 2.0'
						url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
					}
				}

				developers {
					developer {
						id = 'madhephaestus'
						name = 'Kevin Harrington'
						email = 'kharrington@neuronrobotics.com'
					}
				}
			}
		}
	}
}

javadoc {
	if(JavaVersion.current().isJava9Compatible()) {
		options.addBooleanOption('html5', true)
	}
}
