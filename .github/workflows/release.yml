name: Publish to Clojars
on: 
   push:
       tags:       
         - '*'

jobs:
  linux-arm:
    runs-on: ubuntu-24.04-arm
    steps:
    - name: Checkout
      uses: actions/checkout@v1
      with:
          submodules: recursive
    - name: Build
      run: bash build-linux-arm.sh
    - name: Upload math result for job Linux
      uses: actions/upload-artifact@v4
      with:
          name: linux-arm-lib
          path: src/main/resources/linux-arm64/*
  linux:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v1
      with:
          submodules: recursive
    - name: Build
      run: bash build-linux.sh
    - name: Upload math result for job Linux
      uses: actions/upload-artifact@v4
      with:
          name: linux-lib
          path: src/main/resources/linux-x86_64/*

  windows:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v1
      with:
          submodules: recursive
    - uses: ilammy/msvc-dev-cmd@v1
    - uses: microsoft/setup-msbuild@v1.1
    - name: Build
      run: bash build-windows.sh
    - name: Upload math result for job Windows
      uses: actions/upload-artifact@v4
      with:
          name: win-lib
          path: src/main/resources/windows-x86_64/*

  macos:
    runs-on: macos-15
    steps:
    - name: Checkout
      uses: actions/checkout@v1
      with:
          submodules: recursive
    - name: Build
      run: bash build-mac-m1.sh
    - name: Upload math result for job Mac
      uses: actions/upload-artifact@v4
      with:
          name: mac-lib
          path: src/main/resources/macosx-arm64/*
  publish:
    runs-on: ubuntu-latest
    needs: [macos,windows,linux,linux-arm]
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Download natives for Windows
        uses: actions/download-artifact@v4
        with:
          name: win-lib
          path: src/main/resources/windows-x86_64/
      - name: Download natives for Linux Arm
        uses: actions/download-artifact@v4
        with:
          name: linux-arm-lib
          path: src/main/resources/linux-arm64/
      - name: Download natives for Linux
        uses: actions/download-artifact@v4
        with:
          name: linux-lib
          path: src/main/resources/linux-x86_64/
      - name: Download natives for Mac
        uses: actions/download-artifact@v4
        with:
          name: mac-lib
          path: src/main/resources/macosx-arm64/
      - name: Resolve version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: Publish to Clojars
        run: bash publish.sh "${{ steps.version.outputs.version }}"
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_TOKEN: ${{ secrets.CLOJARS_TOKEN }}
      - name: Copy jar for release asset
        run: cp "build/libs/mujoco-java-${{ steps.version.outputs.version }}.jar" mujoco-java.jar
      - name: Make GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: mujoco-java.jar
